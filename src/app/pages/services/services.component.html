@if (content.content(); as site) {
  <section id="services" class="services">
    <div class="container" data-aos="fade-up">
      <div class="section-title">
        <h2>{{ site.ui.sections.services }}</h2>
        <p>{{ site.services.description }}</p>
      </div>

      <div class="row gy-4">
        @for (service of site.services.items; track service.title; let i = $index) {
          <div
            class="col-lg-4 col-md-6 d-flex align-items-stretch"
            data-aos="zoom-in"
            [attr.data-aos-delay]="((i % 3) + 1) * 100"
          >
            <div class="icon-box w-100" [class]="'iconbox-' + service.color">
              <div class="icon">
                <svg class="icon-blob" width="100" height="100" viewBox="0 0 600 600" aria-hidden="true">
                  <path stroke="none" stroke-width="0" fill="#f5f5f5" [attr.d]="blob(service.color)" />
                </svg>
                <fa-icon [icon]="icon(service.icon)" aria-hidden="true" />
              </div>
              <h3 class="h4">{{ service.title }}</h3>
              <p>{{ service.description }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </section>
}
