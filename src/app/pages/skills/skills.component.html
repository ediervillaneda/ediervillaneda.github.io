@if (content.content(); as site) {
  <section id="skills" class="skills section-bg">
    <div class="container" data-aos="fade-up">
      <div class="section-title">
        <h2>{{ site.ui.sections.skills }}</h2>
        <p>{{ site.skills.description }}</p>
      </div>

      <div class="row skills-content" appInView #skills="inView">
        @for (column of columns(); track $index) {
          <div class="col-lg-6">
            @for (skill of column; track skill.name) {
              <div class="progress">
                <span class="skill">{{ skill.name }} <em class="val">{{ skill.level }}%</em></span>
                <div class="progress-bar-wrap">
                  <div
                    class="progress-bar"
                    role="progressbar"
                    [attr.aria-label]="skill.name"
                    [attr.aria-valuenow]="skill.level"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    [style.width.%]="skills.visible() ? skill.level : 0"
                  ></div>
                </div>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </section>
}
