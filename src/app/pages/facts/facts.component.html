@if (content.content(); as site) {
  <section id="facts" class="facts">
    <div class="container" data-aos="fade-up">
      <div class="section-title">
        <h2>{{ site.ui.sections.facts }}</h2>
        <p>{{ site.facts.description }}</p>
      </div>

      <div class="row">
        @for (fact of site.facts.items; track fact.icon) {
          <div class="col-6 col-sm-3">
            <div class="count-box">
              <fa-icon [icon]="icon(fact.icon)" aria-hidden="true" />
              <app-count-up [value]="fact.value" />
              <p>{{ fact.label }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </section>
}
