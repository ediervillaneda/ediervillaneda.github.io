@if (content.content(); as site) {
  <section id="references" class="references section-bg">
    <div class="container" data-aos="fade-up">
      <div class="section-title">
        <h2>{{ site.ui.sections.references }}</h2>
        <p>{{ site.references.description }}</p>
      </div>

      <div class="row gy-4">
        @for (reference of site.references.items; track reference.name; let i = $index) {
          <div
            class="col-lg-4 col-md-6 d-flex align-items-stretch"
            data-aos="zoom-in"
            [attr.data-aos-delay]="(i + 1) * 100"
          >
            <figure class="card w-100 mb-0">
              <div class="card-body d-flex flex-column">
                <figcaption>
                  <h3 class="card-title">{{ reference.name }}</h3>
                  <p class="card-subtitle mb-2 text-muted">
                    {{ reference.position }} &mdash; {{ reference.company }}
                  </p>
                </figcaption>
                <blockquote class="card-text flex-grow-1 mb-0">
                  <fa-icon icon="quote-left" class="quote-icon-left" aria-hidden="true" />
                  {{ reference.testimonial }}
                  <fa-icon icon="quote-right" class="quote-icon-right" aria-hidden="true" />
                </blockquote>
              </div>
            </figure>
          </div>
        }
      </div>
    </div>
  </section>
}
