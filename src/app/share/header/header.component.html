@if (content.ui(); as ui) {
  <button
    type="button"
    class="mobile-nav-toggle"
    aria-controls="header"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? ui.a11y.closeMenu : ui.a11y.openMenu"
    (click)="toggleMenu()"
  >
    <fa-icon [icon]="menuOpen() ? 'xmark' : 'bars'" aria-hidden="true" />
  </button>

  <header id="header" class="d-flex flex-column justify-content-center">
    <nav class="nav-menu" [attr.aria-label]="ui.a11y.mainMenu">
      <ul>
        @for (item of items; track item.id) {
          <li [class.active]="active() === item.target">
            <a
              [href]="'#' + item.target"
              [attr.aria-current]="active() === item.target ? 'true' : null"
              (click)="select(item.target)"
            >
              <fa-icon [icon]="item.icon" aria-hidden="true" />
              <span>{{ ui.nav[item.id] }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="language-switch" role="group" [attr.aria-label]="ui.a11y.language">
      @for (language of languages; track language) {
        <button
          type="button"
          [attr.lang]="language"
          [attr.aria-pressed]="content.language() === language"
          (click)="setLanguage(language)"
        >
          {{ language.toUpperCase() }}
        </button>
      }
    </div>
  </header>
}
