@if (content.content(); as site) {
  <footer id="footer">
    <div class="container">
      <h3>{{ site.hero.name }}</h3>
      <p>{{ site.hero.role }}</p>
      <div class="social-l">
        @for (link of site.hero.social; track link.url) {
          <a [href]="link.url" target="_blank" rel="noopener" [attr.aria-label]="link.label">
            <fa-icon [icon]="['fab', link.icon]" aria-hidden="true" />
          </a>
        }
      </div>
      <div class="copyright">
        &copy; {{ year }} <strong>{{ site.hero.name }}</strong
        >. {{ site.ui.footer.rights }}.
      </div>
      <div class="credits">
        <!-- The BootstrapMade credit must stay with the free MyResume template license. -->
        {{ site.ui.footer.designedBy }}
        <a href="https://bootstrapmade.com/" target="_blank" rel="noopener">BootstrapMade</a>
      </div>
    </div>
  </footer>
}
